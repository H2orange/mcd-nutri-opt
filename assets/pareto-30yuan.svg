  <rect x="76" y="486" width="784" height="44" rx="8" fill="#E6F1FB"/>
  <text x="90" y="504" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#0C447C">线上每个点都是互不支配的解——不存在另一个方案能同时更便宜且蛋白更高</text>
  <text x="90" y="522" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2C2C2A">最省解：麦麦脆汁鸡-琵琶腿 + 优品豆浆小杯　　最高蛋白解：原味板烧鸡腿麦满分 + 麦麦脆汁鸡-琵琶腿</text>
