<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="求解流程">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#FFFFFF"/>

  <text x="24" y="30" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="500" fill="#2C2C2A">求解流程：全部本地计算，无 LLM 参与</text>
  <text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5F5E5A">同一输入永远得到同一结果，可单元测试、可复现</text>

  <path d="M 178 107 L 195 107" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="24" y="74" width="152" height="66" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="100" y="100" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">MCP 取数</text>
  <text x="100" y="120" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">36 项</text>
  <path d="M 353 107 L 370 107" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="199" y="74" width="152" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="275" y="100" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">四级降级对齐</text>
  <text x="275" y="120" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">命中率 79%</text>
  <path d="M 528 107 L 545 107" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="374" y="74" width="152" height="66" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="450" y="100" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">DFS 枚举</text>
  <text x="450" y="120" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">8,818 组合</text>
  <path d="M 703 107 L 720 107" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="549" y="74" width="152" height="66" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="625" y="100" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">约束过滤</text>
  <text x="625" y="120" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">519 可行</text>
  
  <rect x="724" y="74" width="152" height="66" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="800" y="100" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">帕累托前沿</text>
  <text x="800" y="120" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">10 解</text>

  <text x="24" y="232" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5F5E5A">实测耗时 43ms（南京新百门店，2026-10）</text>
</svg>